
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Moon Lander DX — Retro Shareware (Particles + Dust)</title>
<style>
  body { margin:0; background:#000; color:#0f0; font-family:monospace; }
  canvas { display:block; margin:auto; background:#000; image-rendering:pixelated; }
</style>
</head>
<body>
<canvas id="game" width="640" height="480"></canvas>
<script>
/* === Config === */
const canvas = document.getElementById("game"), ctx = canvas.getContext("2d");
const W = canvas.width, H = canvas.height, GROUND_Y = H - 40;
const GRAVITY = 0.004, THRUST = 0.012, SIDE_THRUST = 0.006;
const SAFE_VY = 0.9, SAFE_VX = 0.6;
const PAD_W = 60, PAD_H = 8, PAD_X = W/2 - PAD_W/2, PAD_Y = GROUND_Y - PAD_H;
const SHIP_HALF_HEIGHT = 20;

/* === Input === */
const keys = Object.create(null);
document.addEventListener("keydown", e => {
  if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space"].includes(e.code)) e.preventDefault();
  keys[e.key] = true;
  if (e.code === "Space") init();        // reset always
  if (audioCtx.state === "suspended") audioCtx.resume(); // unlock audio
});
document.addEventListener("keyup", e => keys[e.key] = false);

/* === Audio (retro blips) === */
const audioCtx = new (window.AudioContext||window.webkitAudioContext)();
function playThrust(freq=110, dur=0.12){
  const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
  osc.type = "sawtooth"; osc.frequency.value = freq;
  gain.gain.value = 0.1;
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(); osc.stop(audioCtx.currentTime + dur);
}
let lastMainSound = 0, lastSideSound = 0;

/* === Offscreen buffer + vignette === */
const buf = document.createElement("canvas"); buf.width = W; buf.height = H;
const bctx = buf.getContext("2d");
const vignette = document.createElement("canvas"); vignette.width = W; vignette.height = H;
const vctx = vignette.getContext("2d");
const grad = vctx.createRadialGradient(W/2, H/2, Math.min(W,H)*0.2, W/2, H/2, Math.max(W,H)*0.75);
grad.addColorStop(0, "rgba(0,0,0,0)");
grad.addColorStop(1, "rgba(0,0,0,0.55)");
vctx.fillStyle = grad; vctx.fillRect(0,0,W,H);

/* === Background: stars + parallax mountains === */
const stars = Array.from({length:90}, () => ({x:Math.random()*W,y:Math.random()*H,speed:0.15+Math.random()*0.5}));
function lcg(seed){return ()=> (seed=(seed*1664525+1013904223)>>>0)/0xFFFFFFFF;}
function genMountain(period,step,baseY,amp,seed){
  const rand=lcg(seed); const n=Math.ceil(period/step)+2; const pts=[]; let h=0;
  for(let i=0;i<n;i++){ h+=(rand()-0.5)*0.6; h*=0.9; const y=baseY-h*amp; pts.push({x:i*step,y}); }
  return {pts,period:step*(n-1),step,baseY};
}
const mountains=[
  {layer:genMountain(800,16,GROUND_Y-70,14,12345),speed:0.08,fill:"rgba(0,40,0,0.45)",stroke:"#053"},
  {layer:genMountain(800,12,GROUND_Y-35,22,67890),speed:0.14,fill:"rgba(0,60,0,0.55)",stroke:"#075"}
];
let mountainOffsets=[0,0];

/* === State === */
let lander, endedOnce;
let dust = [];
let thrusterParticles = [];
let emitAccMain = 0, emitAccSideL = 0, emitAccSideR = 0;

function init(){
  lander = {
    x: W/2, y: 50,
    vx: (Math.random()-0.5)*0.5, vy: 0,
    fuel: 200, alive: true, landed: false
  };
  dust.length = 0;
  thrusterParticles.length = 0;
  endedOnce = false;
  emitAccMain = emitAccSideL = emitAccSideR = 0;
}
init();

/* === Particles === */
function spawnDustBurst(x, y, count, strength){
  for(let i=0;i<count;i++){
    const ang = Math.PI + (Math.random()-0.5) * 0.8; // mostly left-right along surface
    const spd = strength * (0.4 + Math.random()*0.8);
    dust.push({
      x, y, vx: Math.cos(ang)*spd, vy: Math.sin(ang)*spd*0.4,
      life: 0.6 + Math.random()*0.5, size: 2 + Math.random()*1.5
    });
  }
}
function updateDust(dt){
  for(const p of dust){
    p.vy += GRAVITY*30 * dt; // heavier gravity feel for dust
    p.x += p.vx * dt * 60;
    p.y += p.vy * dt * 60;
    p.life -= dt;
  }
  dust = dust.filter(p => p.life > 0);
}
function drawDust(c){
  for(const p of dust){
    const a = Math.max(0, p.life/1.0);
    c.globalAlpha = a*0.9;
    c.fillStyle = "rgba(200,200,200,1)";
    c.fillRect(p.x, p.y, p.size, p.size);
  }
  c.globalAlpha = 1;
}

// Thruster flames (main + side) as particles
function emitThruster(dt, mainOn, leftOn, rightOn){
  // emission rates (particles per second)
  const rateMain = 160, rateSide = 120;
  if (mainOn){ emitAccMain += rateMain * dt; }
  if (leftOn){ emitAccSideL += rateSide * dt; }
  if (rightOn){ emitAccSideR += rateSide * dt; }

  // Main thruster: downward cone from ship bottom
  while (emitAccMain >= 1){
    emitAccMain -= 1;
    const baseX = lander.x;
    const baseY = lander.y + SHIP_HALF_HEIGHT;
    const spread = 0.35;
    const ang = Math.PI/2 + (Math.random()-0.5)*spread; // around downward
    const spd = 1.5 + Math.random()*1.2;
    thrusterParticles.push({
      x: baseX + (Math.random()-0.5)*3,
      y: baseY + 2,
      vx: Math.cos(ang)*spd*0.6,
      vy: Math.sin(ang)*spd*1.2,
      life: 0.18 + Math.random()*0.12,
      hue: 35 + Math.random()*15, // orange-yellow
      size: 2 + Math.random()*2,
      type: "main"
    });
  }
  // Left engine: emits leftwards from left side
  while (emitAccSideL >= 1){
    emitAccSideL -= 1;
    const baseX = lander.x - 12, baseY = lander.y + 0;
    const ang = Math.PI + (Math.random()-0.5)*0.35; // left
    const spd = 1.2 + Math.random()*1.0;
    thrusterParticles.push({
      x: baseX - 2, y: baseY + (Math.random()-0.5)*6,
      vx: Math.cos(ang)*spd, vy: Math.sin(ang)*spd*0.5,
      life: 0.14 + Math.random()*0.1,
      hue: 0 + Math.random()*20, // reddish
      size: 1.6 + Math.random()*1.4,
      type: "sideL"
    });
  }
  // Right engine: emits rightwards from right side
  while (emitAccSideR >= 1){
    emitAccSideR -= 1;
    const baseX = lander.x + 12, baseY = lander.y + 0;
    const ang = 0 + (Math.random()-0.5)*0.35; // right
    const spd = 1.2 + Math.random()*1.0;
    thrusterParticles.push({
      x: baseX + 2, y: baseY + (Math.random()-0.5)*6,
      vx: Math.cos(ang)*spd, vy: Math.sin(ang)*spd*0.5,
      life: 0.14 + Math.random()*0.1,
      hue: 0 + Math.random()*20,
      size: 1.6 + Math.random()*1.4,
      type: "sideR"
    });
  }
}

function updateThrusterParticles(dt){
  for(const p of thrusterParticles){
    // Slight turbulence drag
    p.vx *= (1 - 0.8*dt);
    p.vy *= (1 - 0.6*dt);
    // Main exhaust pulls downward a bit more
    if (p.type === "main") p.vy += 0.5 * dt * 60;
    p.x += p.vx * dt * 60;
    p.y += p.vy * dt * 60;
    p.life -= dt;
  }
  thrusterParticles = thrusterParticles.filter(p => p.life > 0);
}

function drawThrusterParticles(c){
  c.save();
  c.globalCompositeOperation = "lighter";
  for(const p of thrusterParticles){
    const alpha = Math.max(0, p.life/0.2);
    const sat = 85, light = 55 + Math.random()*10;
    c.fillStyle = `hsla(${p.hue}, ${sat}%, ${light}%, ${alpha})`;
    c.fillRect(p.x, p.y, p.size, p.size);
  }
  c.restore();
}

/* === Rounded border helpers === */
function drawRoundedRectStroke(c, x, y, w, h, r){
  c.beginPath();
  c.moveTo(x+r, y);
  c.lineTo(x+w-r, y);
  c.arcTo(x+w, y, x+w, y+r, r);
  c.lineTo(x+w, y+h-r);
  c.arcTo(x+w, y+h, x+w-r, y+h, r);
  c.lineTo(x+r, y+h);
  c.arcTo(x, y+h, x, y+h-r, r);
  c.lineTo(x, y+r);
  c.arcTo(x, y, x+r, y, r);
  c.stroke();
}
function drawRoundedRectFill(c, x, y, w, h, r){
  c.beginPath();
  c.moveTo(x+r, y);
  c.lineTo(x+w-r, y);
  c.arcTo(x+w, y, x+w, y+r, r);
  c.lineTo(x+w, y+h-r);
  c.arcTo(x+w, y+h, x+w-r, y+h, r);
  c.lineTo(x+r, y+h);
  c.arcTo(x, y+h, x, y+h-r, r);
  c.lineTo(x, y+r);
  c.arcTo(x, y, x+r, y, r);
  c.fill();
}

/* === Drawing (to back buffer) === */
function drawBackground(c){
  c.fillStyle="#000"; c.fillRect(0,0,W,H);
  c.fillStyle="#0f0";
  for(const s of stars){
    c.fillRect(s.x,s.y,1,1);
    s.x -= s.speed*0.2; if(s.x<0){s.x=W; s.y=Math.random()*H;}
  }
  mountains.forEach((m,i)=>{
    mountainOffsets[i]=(mountainOffsets[i]+m.speed)%m.layer.period;
    const off=mountainOffsets[i];
    c.fillStyle=m.fill; c.strokeStyle=m.stroke; c.lineWidth=1;
    for(let tile=0; tile<2; tile++){
      const x0 = -off + tile*m.layer.period;
      c.beginPath(); c.moveTo(x0, H);
      for(const p of m.layer.pts) c.lineTo(x0+p.x, p.y);
      c.lineTo(x0+m.layer.pts[m.layer.pts.length-1].x, H);
      c.closePath(); c.fill(); c.stroke();
    }
  });
  // Ground baseline
  c.strokeStyle="#244"; c.lineWidth=1;
  c.beginPath(); c.moveTo(0,GROUND_Y); c.lineTo(W,GROUND_Y); c.stroke();
}

function drawPad(c){
  c.fillStyle="#222"; c.fillRect(PAD_X,PAD_Y,PAD_W,PAD_H);
  for(let i=0;i<PAD_W;i+=8){
    c.fillStyle=(i/8)%2===0?"#ff0":"#000";
    c.fillRect(PAD_X+i,PAD_Y,8,PAD_H);
  }
  c.strokeStyle="#0f0"; c.lineWidth=2;
  c.strokeRect(PAD_X-2,PAD_Y-2,PAD_W+4,PAD_H+4);
}

function drawLander(c){
  // Simple upright triangular hull
  c.save(); c.translate(lander.x, lander.y);
  c.strokeStyle="#0f0";
  c.beginPath();
  c.moveTo(0,-SHIP_HALF_HEIGHT);
  c.lineTo(-10,SHIP_HALF_HEIGHT);
  c.lineTo(10,SHIP_HALF_HEIGHT);
  c.closePath(); c.stroke();
  c.restore();
}

function drawGauge(c, x,y,r, value, min,max, label, col, safeRange, fuelMode=false){
  c.save(); c.translate(x,y);
  c.strokeStyle="#0f0"; c.lineWidth=2; c.beginPath(); c.arc(0,0,r,0,Math.PI*2); c.stroke();
  if(safeRange){
    c.strokeStyle="#400"; c.lineWidth=6; c.beginPath();
    c.arc(0,0,r-5,Math.PI*0.75,Math.PI*2.25); c.stroke();
    const s0=Math.PI*(0.75+((safeRange.min-min)/(max-min))*1.5);
    const s1=Math.PI*(0.75+((safeRange.max-min)/(max-min))*1.5);
    c.strokeStyle="#040"; c.beginPath(); c.arc(0,0,r-5,s0,s1); c.stroke();
  }
  c.strokeStyle="#0f0"; c.lineWidth=1;
  for(let i=0;i<=10;i++){
    const ang=Math.PI*(0.75+(i/10)*1.5);
    c.beginPath();
    c.moveTo(Math.cos(ang)*(r-2),Math.sin(ang)*(r-2));
    c.lineTo(Math.cos(ang)*(r-8),Math.sin(ang)*(r-8));
    c.stroke();
  }
  const clamp=Math.max(min,Math.min(value,max));
  const pct=(clamp-min)/(max-min);
  const a=Math.PI*(0.75+pct*1.5);
  c.strokeStyle=col; c.beginPath(); c.moveTo(0,0);
  c.lineTo(Math.cos(a)*(r-10),Math.sin(a)*(r-10)); c.stroke();
  let hub=col;
  if(fuelMode){ hub = value<20?"#f00":(value<50?"#ff0":"#0f0"); }
  else if(safeRange && (value<safeRange.min||value>safeRange.max)){
    hub=(Math.floor(performance.now()/200)%2)?"#f00":"#800";
  }
  c.fillStyle=hub; c.beginPath(); c.arc(0,0,3,0,Math.PI*2); c.fill();
  c.fillStyle="#0f0"; c.font="10px monospace"; c.textAlign="center";
  c.fillText(label,0,r+12);
  c.restore();
}

function drawHUD(c){
  // Gauges flanking the pad
  drawGauge(c, PAD_X-40, PAD_Y-30, 26, Math.max(0, lander.fuel), 0, 200, "FUEL", "#0f0", null, true);
  drawGauge(c, PAD_X+PAD_W+40, PAD_Y-30, 26, lander.vy, -3, 3, "V-VEL", "#ff0", {min:-SAFE_VY, max:SAFE_VY});
  // Controls + data
  c.fillStyle="#0f0"; c.font="12px monospace";
  c.fillText("Arrows: thrust   Space: reset", 12, 18);
  c.fillText(`Fuel: ${Math.max(0, lander.fuel).toFixed(0)}   VX: ${lander.vx.toFixed(2)}   VY: ${lander.vy.toFixed(2)}`, 12, 34);
  // Outcome text
  if(lander.landed) c.fillText("MISSION SUCCESS", W/2-60, H/2);
  else if(!lander.alive) c.fillText("MISSION FAILED", W/2-60, H/2);
}

/* === Compose scene to back buffer === */
function renderSceneToBuffer(){
  bctx.setTransform(1,0,0,1,0,0);
  bctx.clearRect(0,0,W,H);
  drawBackground(bctx);
  drawPad(bctx);
  // Dust appears over ground, under lander
  drawDust(bctx);
  if (lander.alive || lander.landed) drawLander(bctx);
  // Thruster particles on top for glow
  drawThrusterParticles(bctx);
  drawHUD(bctx);
}

/* === Post FX (no jitter): bloom, vignette, scanlines, rounded border, title badge === */
function postFXDraw(){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,W,H);

  // Base scene
  ctx.filter = "none";
  ctx.drawImage(buf, 0, 0);

  // Subtle bloom/bleed
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  ctx.globalAlpha = 0.10;
  ctx.filter = "blur(1.4px) brightness(1.25)";
  ctx.drawImage(buf, 0, 0);
  ctx.restore();

  // Vignette
  ctx.globalAlpha = 1; ctx.filter = "none";
  ctx.drawImage(vignette, 0, 0);

  // Scanlines (steady)
  const flicker = 0.04 + 0.015 * Math.sin(performance.now()*0.03);
  ctx.fillStyle = `rgba(0,0,0,${flicker})`;
  for (let y=0; y<H; y+=2) ctx.fillRect(0, y, W, 1);

  // Rounded neon border
  ctx.save();
  ctx.lineWidth = 3.5; ctx.strokeStyle = "rgba(0,255,0,0.35)";
  drawRoundedRectStroke(ctx, 6, 6, W-12, H-12, 10);
  ctx.lineWidth = 2; ctx.strokeStyle = "rgba(0,64,0,0.55)";
  drawRoundedRectStroke(ctx, 12, 12, W-24, H-24, 8);
  ctx.restore();

  // Title badge top-right
  const label = "Moon Lander DX — Shareware";
  ctx.font = "bold 12px monospace";
  const tw = Math.ceil(ctx.measureText(label).width) + 16, th = 20;
  const bx = W - tw - 14, by = 12;
  ctx.fillStyle = "rgba(0,0,0,0.6)";
  drawRoundedRectFill(ctx, bx, by, tw, th, 6);
  ctx.strokeStyle = "rgba(0,255,0,0.25)";
  ctx.lineWidth = 1.5; drawRoundedRectStroke(ctx, bx, by, tw, th, 6);
  ctx.fillStyle = "#0f0"; ctx.textBaseline = "top";
  ctx.fillText(label, bx+8, by+4);
}

/* === Physics === */
let lastTime = performance.now();
function update(dt){
  // Move stars (already handled in draw), mountains offset handled in draw
  if (!lander.alive || lander.landed) return;

  const now = performance.now();
  let mainOn=false, leftOn=false, rightOn=false;

  // Controls
  if (keys["ArrowDown"] && lander.fuel > 0){
    lander.vy -= THRUST;
    lander.fuel = Math.max(0, lander.fuel - 0.4);
    mainOn = true;
    if (now - lastMainSound > 90){ playThrust(110, 0.12); lastMainSound = now; }
  }
  // Inverted horizontal: Left => move right, left engine fires (exhaust left)
  if (keys["ArrowLeft"] && lander.fuel > 0){
    lander.vx += SIDE_THRUST;
    lander.fuel = Math.max(0, lander.fuel - 0.25);
    leftOn = true;
    if (now - lastSideSound > 120){ playThrust(220, 0.08); lastSideSound = now; }
  }
  // Right => move left, right engine fires (exhaust right)
  if (keys["ArrowRight"] && lander.fuel > 0){
    lander.vx -= SIDE_THRUST;
    lander.fuel = Math.max(0, lander.fuel - 0.25);
    rightOn = true;
    if (now - lastSideSound > 120){ playThrust(220, 0.08); lastSideSound = now; }
  }

  // Emit thruster particles
  emitThruster(dt, mainOn, leftOn, rightOn);

  // Gravity and integrate
  lander.vy += GRAVITY;
  lander.x += lander.vx;
  lander.y += lander.vy;

  // Bounds
  if (lander.x < 10){ lander.x = 10; lander.vx = 0; }
  if (lander.x > W-10){ lander.x = W-10; lander.vx = 0; }

  // Collision
  const shipBottom = lander.y + SHIP_HALF_HEIGHT;
  const onPadX = lander.x > PAD_X && lander.x < PAD_X + PAD_W;

  if (!endedOnce && ((shipBottom >= PAD_Y && onPadX) || shipBottom >= GROUND_Y)){
    const soft = (Math.abs(lander.vx) <= SAFE_VX && lander.vy <= SAFE_VY && onPadX);
    if (soft){
      lander.landed = true;
      lander.vx = 0; lander.vy = 0;
      lander.y = PAD_Y - SHIP_HALF_HEIGHT;
    } else {
      lander.alive = false;
    }
    // Dust kick-up at contact point
    const impact = Math.min(3.0, Math.sqrt(lander.vx*lander.vx + lander.vy*lander.vy)*5 + (soft? 1.0 : 2.5));
    const contactX = lander.x, contactY = Math.min(PAD_Y, GROUND_Y);
    spawnDustBurst(contactX, contactY+2, 24 + Math.floor(impact*18), 1.2 + impact*0.8);
    endedOnce = true;
  }
}

function updateAll(dt){
  update(dt);
  updateDust(dt);
  updateThrusterParticles(dt);
}

/* === Frame loop === */
function frame(){
  const now = performance.now();
  const dt = Math.min(0.033, (now - lastTime) / 1000); // clamp dt
  lastTime = now;

  updateAll(dt);
  renderSceneToBuffer();
  postFXDraw();
  requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>
